# v++ link config: WiFi OFDM receiver + CSI conditioner + AI Engine feature graph
# on the VRK160 base platform (vrk160_base, 2025.2).
#
#   mm2s_iq --(iq_mux inserted by overlay_rf.tcl, RF-DC on its other input)--> wifi_ddc.iq_in
#   wifi_ddc -> ofdm_fe -> ofdm_be -> csi_feat -> ai_engine_0 {PLIO_in, PLIO_brt_in, PLIO_phase_in}
#   ai_engine_0 {PLIO_out, PLIO_brt_out, PLIO_phase_out} -> feat_pack -> s2mm_feat -> DDR
#   ofdm_be.rec (CSI records) -> s2mm_csi -> DDR ;  csi_feat.tag -> feat_pack
# All PL kernels run on the platform default clock (index 1, 312.5 MHz).
# wifi_ddc / ofdm_fe / ofdm_be / csi_feat / feat_pack are free-running
# (ap_ctrl_none); only the three movers are XRT-controlled.

[connectivity]
nk=mm2s:1:mm2s_iq
nk=s2mm:2:s2mm_csi.s2mm_feat
nk=wifi_ddc:1:wifi_ddc
nk=ofdm_fe:1:ofdm_fe
nk=ofdm_be:1:ofdm_be
nk=csi_feat:1:csi_feat
nk=feat_pack:1:feat_pack

sp=mm2s_iq.mem:LPDDR
sp=s2mm_csi.mem:LPDDR
sp=s2mm_feat.mem:LPDDR

stream_connect=mm2s_iq.s:wifi_ddc.iq_in
stream_connect=wifi_ddc.iq_out:ofdm_fe.iq_in
stream_connect=ofdm_fe.cap:ofdm_be.cap:1024
stream_connect=ofdm_be.csi:csi_feat.csi_in:512
stream_connect=ofdm_be.rec:s2mm_csi.s:2048
stream_connect=csi_feat.mot:ai_engine_0.PLIO_in
stream_connect=csi_feat.brt:ai_engine_0.PLIO_brt_in
stream_connect=csi_feat.phs:ai_engine_0.PLIO_phase_in
stream_connect=csi_feat.tag:feat_pack.tag:64
stream_connect=ai_engine_0.PLIO_out:feat_pack.mot
stream_connect=ai_engine_0.PLIO_brt_out:feat_pack.brt
stream_connect=ai_engine_0.PLIO_phase_out:feat_pack.phs
stream_connect=feat_pack.feat_out:s2mm_feat.s:512

[vivado]
synth.jobs=16
impl.jobs=16
