# /home/root/wifi-har/wifi-har.conf - read by wifi-har-autorun.sh at boot
#   MODE=demo : self-test, then dashboard fed by paced DDR playback of vectors/demo
#   MODE=live : self-test, then dashboard fed by the RF-ADC (antenna on ADC tile 200 vin00)
#   MODE=off  : self-test only
MODE=demo
CHAN=6          # live: 2.4 GHz channel 1..11 (RF-DC NCO at ch6, PL NCO covers +/-25 MHz)
PORT=8080       # dashboard http port
SELFTEST=1      # run the OFDM RX / AIE golden self-test first (vectors/quick)
